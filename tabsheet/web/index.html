<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tabsheet</title>
<style>
  :root {
    --ink: #18213b;
    --ink-soft: #55607a;
    --paper: #eef1f5;
    --sheet: #ffffff;
    --rule: #d3dae4;
    --seafoam: #2fa88f;
    --seafoam-dark: #1d7a68;
    --hilite: rgba(246, 226, 122, .26);
    --cursor: #3f9bd6;
    --danger: #b3261e;
    --radius: 6px;
    --font: "Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; color: var(--ink); font: 15px/1.6 var(--font);
    font-variant-numeric: tabular-nums; background: var(--paper);
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--seafoam); outline-offset: 2px; }

  /* 헤더: 타브 악보의 6줄 오선 위에 이름이 놓인 모양 */
  header {
    height: 64px; border-bottom: 1px solid var(--rule);
    background: repeating-linear-gradient(to bottom, transparent 0 9px, var(--rule) 9px 10px);
    display: flex; align-items: center; padding: 0 24px;
  }
  header .mark { background: var(--paper); padding: 4px 14px 4px 0; display: flex; align-items: baseline; gap: 14px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  main { max-width: 1280px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 0 16px; } header p { display: none; } }

  /* 스테이지 */
  .stage { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .drop {
    min-height: 360px; display: grid; place-items: center; text-align: center; padding: 32px;
    border: 2px dashed var(--rule); margin: 16px; border-radius: var(--radius); cursor: pointer; color: var(--ink-soft);
  }
  .drop:hover, .drop.over { border-color: var(--seafoam); background: #f3fbf9; }
  .drop strong { display: block; color: var(--ink); font-size: 19px; margin-bottom: 6px; letter-spacing: -.01em; }
  .frame-wrap { position: relative; line-height: 0; cursor: crosshair; touch-action: none; user-select: none; background: #111; }
  .frame-wrap img { width: 100%; height: auto; display: block; -webkit-user-drag: none; }
  /* 선택 영역: 영상 속 마디 하이라이트(노랑)와 왼쪽 커서선을 닮게 */
  .sel {
    position: absolute; background: var(--hilite); border: 2px solid var(--ink); pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(10, 16, 32, .38);
  }
  .sel::before { content: ""; position: absolute; left: 0; top: -2px; bottom: -2px; width: 2px; background: var(--cursor); }
  .scrub { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--rule); }
  .scrub input[type=range] { flex: 1; accent-color: var(--seafoam-dark); }
  .scrub output { min-width: 96px; text-align: right; color: var(--ink-soft); }
  .hint { margin: 0; padding: 0 16px 14px; color: var(--ink-soft); font-size: 14px; }

  /* 패널 */
  aside { display: grid; gap: 16px; }
  .step { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; }
  .step h2 { margin: 0 0 10px; font-size: 16px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; }
  .step h2 .n { color: var(--seafoam-dark); font-weight: 800; }
  .step.off { opacity: .55; }
  .muted { color: var(--ink-soft); font-size: 14px; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  label.f { display: grid; gap: 4px; font-size: 13px; color: var(--ink-soft); }
  input[type=number], select {
    width: 100%; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink);
  }
  .btn {
    appearance: none; border: 1px solid var(--ink); background: var(--ink); color: #fff; padding: 10px 16px;
    border-radius: var(--radius); font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn:hover:not(:disabled) { background: #263259; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn.ghost:hover:not(:disabled) { background: var(--paper); }
  .btn.small { width: auto; padding: 6px 10px; font-size: 13px; font-weight: 500; }
  .stack { display: grid; gap: 10px; }
  details { margin: 10px 0; }
  summary { cursor: pointer; color: var(--ink-soft); font-size: 14px; padding: 4px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .meta { color: var(--ink-soft); font-size: 14px; overflow-wrap: anywhere; margin: 8px 0 0; }

  .media { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .media .line { display: flex; gap: 8px; align-items: center; }
  .media select { flex: 1; min-width: 0; }
  .bar { height: 6px; background: var(--paper); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--seafoam); transition: width .25s; }
  .status { min-height: 1.4em; margin: 8px 0 0; font-size: 14px; color: var(--ink-soft); }
  .status.error { color: var(--danger); }

  /* 결과 */
  .results { grid-column: 1 / -1; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; }
  .results header { all: unset; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .results h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .pieces { display: grid; gap: 12px; }
  .piece { margin: 0; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: #fafbfc; }
  .piece img { display: block; width: 100%; height: auto; background: #fff; }
  .piece.skip img { opacity: .25; }
  .piece figcaption { padding: 8px 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--rule); font-size: 14px; }
  .piece input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--seafoam-dark); }
  .piece .time { margin-left: auto; color: var(--ink-soft); }
  .outputs { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .outputs .btn { width: auto; }
  .outputs a { color: var(--seafoam-dark); font-weight: 600; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="mark"><h1>tabsheet</h1><p>타브 악보 영상에서 악보만 골라 PDF·JPG로 모읍니다</p></div>
</header>

<main>
  <section class="stage" aria-label="영상 미리보기">
    <div id="drop" class="drop" tabindex="0" role="button" aria-label="영상 파일 선택">
      <div><strong>영상 파일을 여기에 놓으세요</strong>또는 클릭해서 선택 (mp4, mov, mkv, webm)</div>
    </div>
    <div id="frameWrap" class="frame-wrap" hidden><img id="frame" alt="영상 프레임" draggable="false"><div id="sel" class="sel" hidden></div></div>
    <div id="scrub" class="scrub" hidden>
      <label for="time">화면 위치</label>
      <input id="time" type="range" min="0" max="0" step="0.1" value="0">
      <output id="timeOut" for="time">0:00</output>
    </div>
    <p id="stageHint" class="hint" hidden>악보가 보이는 시점으로 옮긴 뒤, 화면에서 악보 영역을 드래그하세요. 다시 드래그하면 영역이 바뀝니다.</p>
  </section>

  <aside>
    <section class="step" id="s1">
      <h2><span class="n">1</span>영상 열기</h2>
      <button class="btn ghost" id="pick" type="button">영상 파일 선택</button>
      <input id="file" type="file" accept="video/*,.mkv" hidden>
      <div class="media" id="mediaBox" hidden>
        <p class="muted" style="margin-bottom:8px">또는 서버 폴더에 있는 영상 열기 (업로드 없이)</p>
        <div class="line">
          <select id="mediaSel" aria-label="서버 폴더의 영상"></select>
          <button class="btn small" id="mediaOpen" type="button">열기</button>
          <button class="btn ghost small" id="mediaRefresh" type="button">새로고침</button>
        </div>
      </div>
      <p class="meta" id="videoMeta">아직 열린 영상이 없습니다.</p>
      <div class="bar" id="upBar" hidden><i></i></div>
    </section>

    <section class="step off" id="s2">
      <h2><span class="n">2</span>악보 영역</h2>
      <p class="muted">화면에서 드래그하거나 값을 직접 입력하세요. 단위는 픽셀입니다.</p>
      <div class="row">
        <label class="f">x<input id="bx" type="number" min="0" step="1"></label>
        <label class="f">y<input id="by" type="number" min="0" step="1"></label>
        <label class="f">너비<input id="bw" type="number" min="1" step="1"></label>
        <label class="f">높이<input id="bh" type="number" min="1" step="1"></label>
      </div>
      <p style="margin:10px 0 0"><button class="btn ghost small" id="clearSel" type="button">영역 지우기</button></p>
    </section>

    <section class="step off" id="s3">
      <h2><span class="n">3</span>악보 추출</h2>
      <div class="grid2">
        <label class="f">시작(초)<input id="pStart" type="number" min="0" step="0.5" value="0"></label>
        <label class="f">끝(초, 비우면 끝까지)<input id="pEnd" type="number" min="0" step="0.5"></label>
      </div>
      <details>
        <summary>세부 설정</summary>
        <div class="grid2">
          <label class="f">샘플 간격(초)<input id="pInterval" type="number" min="0.05" max="10" step="0.05" value="0.5"></label>
          <label class="f">최소 연속 샘플<input id="pMinRun" type="number" min="1" step="1" value="2"></label>
          <label class="f">같은 악보로 볼 기준<input id="pStable" type="number" min="0" max="1" step="0.01" value="0.10"></label>
          <label class="f">느린 페이드 기준<input id="pAnchor" type="number" min="0" max="1" step="0.01" value="0.20"></label>
          <label class="f">중복 병합 기준<input id="pDedupe" type="number" min="0" max="1" step="0.01" value="0.05"></label>
          <label class="f">흐린 조각 제거 비율<input id="pContrast" type="number" min="0" max="1" step="0.05" value="0.8"></label>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"><input id="pMedian" type="checkbox" checked> 커서·하이라이트 지우기</label>
      </details>
      <button class="btn" id="run" type="button" disabled>악보 추출</button>
      <div class="bar" id="runBar" hidden><i></i></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </aside>

  <section class="results" id="results" hidden aria-label="추출 결과">
    <header>
      <h2 id="resTitle">악보 조각</h2>
      <div class="toolbar">
        <button class="btn ghost small" id="selAll" type="button">모두 선택</button>
        <button class="btn ghost small" id="selNone" type="button">모두 해제</button>
      </div>
    </header>
    <div class="pieces" id="pieces"></div>
    <div class="outputs">
      <button class="btn" id="buildPdf" type="button">PDF 만들기</button>
      <button class="btn ghost" id="buildJpg" type="button">JPG 만들기</button>
      <span id="buildOut"></span>
    </div>
    <p class="status" id="buildStatus" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const S = { vid: null, info: null, bbox: null, job: null, poll: null, frameTimer: null };

const fmtTime = (s) => {
  const t = Math.round(Math.max(0, s) * 10); // 0.1초 단위로 먼저 반올림해야 59.99 -> 0:60.0 이 되지 않는다
  const m = Math.floor(t / 600);
  return `${m}:${((t - m * 600) / 10).toFixed(1).padStart(4, "0")}`;
};
const setStatus = (el, msg, err = false) => { el.textContent = msg; el.classList.toggle("error", err); };

/* ---------- 1. 영상 열기 ---------- */
const drop = $("drop"), fileInput = $("file");
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
$("pick").addEventListener("click", () => fileInput.click());
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) upload(f); });
fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });

const JSON_H = { "Content-Type": "application/json" };
const CHUNK_START = 4 * 1024 * 1024, CHUNK_MIN = 256 * 1024;
const fmtSize = (b) => (b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.max(1, Math.round(b / 1e6)) + " MB");

async function api(path, opts) {
  let r;
  try { r = await fetch(path, opts); }
  catch (_) { throw new Error("서버에 연결하지 못했습니다. tabsheet gui가 실행 중인지 확인해 주세요."); }
  let body = null;
  try { body = await r.json(); } catch (_) {}
  if (!r.ok) {
    const e = new Error((body && body.error) || `서버 응답 오류 (HTTP ${r.status})`);
    e.status = r.status;
    throw e;
  }
  return body;
}

// 큰 파일을 조각으로 나눠 올린다. 프록시가 413을 주면 조각을 절반으로 줄여 같은 위치부터 다시 보낸다.
async function upload(file) {
  if (S.uploading) return;
  S.uploading = true;
  const bar = $("upBar"), fill = bar.firstElementChild;
  bar.hidden = false; fill.style.width = "0";
  $("videoMeta").textContent = `${file.name} 올리는 중…`;
  try {
    const { upload: uid } = await api("/api/upload/start", {
      method: "POST", headers: JSON_H, body: JSON.stringify({ name: file.name, size: file.size }),
    });
    let offset = 0, chunk = CHUNK_START, fails = 0;
    while (offset < file.size) {
      try {
        const r = await api(`/api/upload/chunk?upload=${uid}&offset=${offset}`, {
          method: "POST", body: file.slice(offset, Math.min(offset + chunk, file.size)),
        });
        if (r.received <= offset) throw new Error("서버가 업로드 진행을 확인하지 못했습니다.");
        offset = r.received; fails = 0;
        const pct = Math.round(offset / file.size * 100);
        fill.style.width = pct + "%";
        $("videoMeta").textContent = `${file.name} 올리는 중… ${pct}%`;
      } catch (e) {
        if (e.status === 413) {
          if (chunk <= CHUNK_MIN) throw new Error("서버(또는 프록시)가 업로드 크기를 거부했습니다 (HTTP 413). 서버 폴더에서 열기를 사용해 주세요.");
          chunk = Math.max(CHUNK_MIN, Math.floor(chunk / 2));
          continue;
        }
        const retryable = !e.status || e.status >= 500 || e.status === 408 || e.status === 429;
        if (!retryable || ++fails > 4) throw e;
        await new Promise((ok) => setTimeout(ok, 800 * fails));
      }
    }
    openVideo(await api("/api/upload/finish", { method: "POST", headers: JSON_H, body: JSON.stringify({ upload: uid }) }));
  } catch (e) {
    $("videoMeta").textContent = e.message || "영상을 올리지 못했습니다.";
  } finally {
    S.uploading = false; bar.hidden = true; fileInput.value = "";
  }
}

// 업로드/서버 폴더 어느 쪽으로 열든 여기로 합류
function openVideo(res) {
  S.vid = res.id; S.info = res.info; S.bbox = null; S.job = null;
  const i = res.info;
  $("videoMeta").textContent = `${res.name} — ${i.width}×${i.height}, ${fmtTime(i.duration)}`;
  $("time").max = Math.max(i.duration - 0.1, 0);
  $("time").value = Math.min(i.duration * 0.25, i.duration);
  drop.hidden = true; $("frameWrap").hidden = false; $("scrub").hidden = false; $("stageHint").hidden = false;
  $("s2").classList.remove("off"); $("s3").classList.remove("off");
  $("results").hidden = true; setStatus($("status"), "");
  loadFrame(); syncInputs(); updateRunState();
}

/* ---------- 서버 폴더에서 열기 (tabsheet gui --media-dir 일 때만 보임) ---------- */
async function loadMedia() {
  try {
    const m = await api("/api/media");
    if (!m.enabled) return;
    $("mediaBox").hidden = false;
    const sel = $("mediaSel"); sel.textContent = "";
    if (!m.files.length) { sel.add(new Option(`${m.dir} 폴더에 영상이 없습니다`, "")); $("mediaOpen").disabled = true; return; }
    $("mediaOpen").disabled = false;
    for (const f of m.files) sel.add(new Option(`${f.name} (${fmtSize(f.size)})`, f.name));
  } catch (_) { /* 목록을 못 읽어도 업로드는 그대로 쓸 수 있다 */ }
}
$("mediaRefresh").addEventListener("click", loadMedia);
$("mediaOpen").addEventListener("click", async () => {
  const name = $("mediaSel").value; if (!name) return;
  $("videoMeta").textContent = `${name} 여는 중…`;
  try { openVideo(await api("/api/open", { method: "POST", headers: JSON_H, body: JSON.stringify({ name }) })); }
  catch (e) { $("videoMeta").textContent = e.message; }
});
loadMedia();

/* ---------- 프레임 / 시간 이동 ---------- */
function loadFrame() {
  $("timeOut").textContent = `${fmtTime(+$("time").value)} / ${fmtTime(S.info.duration)}`;
  $("frame").src = `/api/frame?id=${S.vid}&t=${$("time").value}&_=${Date.now()}`;
}
$("time").addEventListener("input", () => {
  $("timeOut").textContent = `${fmtTime(+$("time").value)} / ${fmtTime(S.info.duration)}`;
  clearTimeout(S.frameTimer); S.frameTimer = setTimeout(loadFrame, 120);
});
$("frame").addEventListener("load", drawSel);
window.addEventListener("resize", drawSel);

/* ---------- 2. 영역 지정 (드래그) ---------- */
const wrap = $("frameWrap");
let dragStart = null;
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

function toVideo(clientX, clientY) {
  const r = $("frame").getBoundingClientRect();
  const k = S.info.width / r.width;
  return [clamp((clientX - r.left) * k, 0, S.info.width), clamp((clientY - r.top) * k, 0, S.info.height)];
}
wrap.addEventListener("pointerdown", (e) => {
  if (!S.info) return;
  wrap.setPointerCapture(e.pointerId);
  dragStart = toVideo(e.clientX, e.clientY);
});
wrap.addEventListener("pointermove", (e) => {
  if (!dragStart) return;
  const [x, y] = toVideo(e.clientX, e.clientY);
  setBBox(Math.min(dragStart[0], x), Math.min(dragStart[1], y), Math.abs(x - dragStart[0]), Math.abs(y - dragStart[1]));
});
const endDrag = (e) => {
  if (!dragStart) return;
  dragStart = null;
  if (S.bbox && (S.bbox.w < 8 || S.bbox.h < 8)) { S.bbox = null; drawSel(); syncInputs(); updateRunState(); }
};
wrap.addEventListener("pointerup", endDrag);
wrap.addEventListener("pointercancel", endDrag);

function setBBox(x, y, w, h) {
  x = Math.round(x); y = Math.round(y);
  w = Math.round(Math.min(w, S.info.width - x)); h = Math.round(Math.min(h, S.info.height - y));
  S.bbox = { x, y, w, h };
  drawSel(); syncInputs(); updateRunState();
}
function drawSel() {
  const sel = $("sel");
  if (!S.bbox || !S.info) { sel.hidden = true; return; }
  const k = $("frame").clientWidth / S.info.width;
  sel.hidden = false;
  Object.assign(sel.style, { left: S.bbox.x * k + "px", top: S.bbox.y * k + "px", width: S.bbox.w * k + "px", height: S.bbox.h * k + "px" });
}
function syncInputs() {
  const b = S.bbox;
  $("bx").value = b ? b.x : ""; $("by").value = b ? b.y : ""; $("bw").value = b ? b.w : ""; $("bh").value = b ? b.h : "";
}
["bx", "by", "bw", "bh"].forEach((id) => $(id).addEventListener("change", () => {
  if (!S.info) return;
  const v = ["bx", "by", "bw", "bh"].map((i) => parseInt($(i).value, 10));
  if (v.some(Number.isNaN) || v[2] < 1 || v[3] < 1) return;
  setBBox(clamp(v[0], 0, S.info.width - 1), clamp(v[1], 0, S.info.height - 1), v[2], v[3]);
}));
$("clearSel").addEventListener("click", () => { S.bbox = null; drawSel(); syncInputs(); updateRunState(); });

function updateRunState() {
  const ok = !!(S.info && S.bbox && S.bbox.w >= 8 && S.bbox.h >= 8);
  $("run").disabled = !ok;
  if (S.info && !ok) setStatus($("status"), "먼저 화면에서 악보 영역을 드래그하세요.");
  else if (ok && $("status").textContent.startsWith("먼저")) setStatus($("status"), "");
}

/* ---------- 3. 추출 ---------- */
function paramsFromForm() {
  const n = (id) => { const v = parseFloat($(id).value); return Number.isNaN(v) ? undefined : v; };
  return {
    interval: n("pInterval"), min_run: n("pMinRun"), stable_thr: n("pStable"), anchor_thr: n("pAnchor"),
    dedupe_thr: n("pDedupe"), contrast_ratio: n("pContrast"), median: $("pMedian").checked,
  };
}
$("run").addEventListener("click", async () => {
  const b = S.bbox; if (!b) return;
  $("run").disabled = true; $("results").hidden = true;
  const bar = $("runBar"); bar.hidden = false; bar.firstElementChild.style.width = "0";
  setStatus($("status"), "악보를 찾는 중…");
  const endV = $("pEnd").value;
  const r = await fetch("/api/extract", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: S.vid, bbox: [b.x, b.y, b.w, b.h], params: paramsFromForm(),
                           start: parseFloat($("pStart").value) || 0, end: endV === "" ? null : parseFloat(endV) }),
  });
  const res = await r.json();
  if (!r.ok) { fail(res.error || "추출을 시작하지 못했습니다."); return; }
  S.job = res.job;
  clearInterval(S.poll);
  S.poll = setInterval(pollJob, 400);
});
function fail(msg) { clearInterval(S.poll); $("runBar").hidden = true; setStatus($("status"), msg, true); updateRunState(); $("run").disabled = !S.bbox; }

async function pollJob() {
  const r = await fetch(`/api/job?job=${S.job}`); const j = await r.json();
  if (!r.ok) return fail(j.error || "작업 상태를 읽지 못했습니다.");
  $("runBar").firstElementChild.style.width = (j.progress * 100) + "%";
  if (j.status === "running") { setStatus($("status"), `악보를 찾는 중… ${Math.round(j.progress * 100)}%`); return; }
  clearInterval(S.poll);
  $("runBar").hidden = true; $("run").disabled = false;
  if (j.status === "error") return fail(j.error);
  setStatus($("status"), `악보 조각 ${j.segments.length}개를 찾았습니다.`);
  showResults(j.segments);
}

/* ---------- 4. 결과 ---------- */
function showResults(segs) {
  $("resTitle").textContent = `악보 조각 ${segs.length}개`;
  const box = $("pieces"); box.textContent = "";
  for (const s of segs) {
    const fig = document.createElement("figure"); fig.className = "piece";
    const img = document.createElement("img"); img.src = s.url; img.alt = `악보 조각 ${s.index}`; img.loading = "lazy";
    const cap = document.createElement("figcaption");
    const lab = document.createElement("label"); lab.style.cssText = "display:flex;gap:8px;align-items:center;cursor:pointer";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = true; cb.dataset.i = s.index;
    cb.addEventListener("change", () => fig.classList.toggle("skip", !cb.checked));
    lab.append(cb, document.createTextNode(`조각 ${s.index}`));
    const tm = document.createElement("span"); tm.className = "time"; tm.textContent = `${fmtTime(s.t_start)} – ${fmtTime(s.t_end)}`;
    cap.append(lab, tm); fig.append(img, cap); box.append(fig);
  }
  $("buildOut").textContent = ""; setStatus($("buildStatus"), "");
  $("results").hidden = false;
  $("results").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
const setAll = (v) => document.querySelectorAll("#pieces input[type=checkbox]").forEach((c) => { c.checked = v; c.dispatchEvent(new Event("change")); });
$("selAll").addEventListener("click", () => setAll(true));
$("selNone").addEventListener("click", () => setAll(false));

async function build(format) {
  const include = [...document.querySelectorAll("#pieces input:checked")].map((c) => +c.dataset.i);
  if (!include.length) { setStatus($("buildStatus"), "포함할 악보 조각을 하나 이상 선택해 주세요.", true); return; }
  setStatus($("buildStatus"), "만드는 중…");
  const r = await fetch("/api/build", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ job: S.job, include, format }) });
  const res = await r.json();
  if (!r.ok) { setStatus($("buildStatus"), res.error || "파일을 만들지 못했습니다.", true); return; }
  const out = $("buildOut"); out.textContent = "";
  res.files.forEach((f, idx) => {
    const a = document.createElement("a"); a.href = f.url; a.download = f.name; a.textContent = `${f.name} 내려받기`;
    if (idx) out.append(" ");
    out.append(a);
  });
  setStatus($("buildStatus"), format === "pdf" ? "PDF를 만들었습니다." : `JPG ${res.files.length}장을 만들었습니다.`);
}
$("buildPdf").addEventListener("click", () => build("pdf"));
$("buildJpg").addEventListener("click", () => build("jpg"));
</script>
